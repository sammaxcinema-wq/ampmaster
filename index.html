<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sunhands Auto Care — Complete Workshop Management</title>

    <!-- ===================== PWA: Manifest ===================== -->
    <script>
        (function() {
            const manifest = {
                "name": "Sunhands Auto Care",
                "short_name": "Sunhands",
                "description": "Quotations, Invoices, Receipts, Work Orders & Vehicle Checklists",
                "start_url": window.location.href.split('?')[0],
                "display": "standalone",
                "background_color": "#f0f2f5",
                "theme_color": "#111827",
                "orientation": "portrait",
                "icons": [
                    {
                        "src": "https://i.ibb.co/0RQfKqkW/1777590981480.png",
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": "https://i.ibb.co/0RQfKqkW/1777590981480.png",
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ======================== ROOT VARIABLES ======================== */
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --bg: #f0f2f5;
            --card: #fff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --header-bg: #111827;
            --gold: #d4a843;
            --orange: #f97316;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --red: #ef4444;
            --radius: 14px;
            --shadow: 0 1px 8px rgba(0,0,0,0.06);
            --transition: 0.2s ease;
            --tab-height: 56px;
            --btn-height: 56px;
        }

        /* ======================== RESET & BASE ======================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; -webkit-font-smoothing: antialiased; }

        /* ======================== HEADER ======================== */
        .app-header { background: var(--header-bg); padding: 14px 16px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .logo-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; background: #1a1f2b; border: 2px solid rgba(212,168,67,0.5); }
        .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text { flex: 1; min-width: 160px; }
        .logo-text .brand { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(18px, 3.5vw, 26px); color: #fff; letter-spacing: 2px; line-height: 1.1; }
        .logo-text .tagline { font-size: clamp(10px, 1.4vw, 13px); color: var(--gold); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; }
        .doc-number { background: rgba(34,197,94,0.18); border: 2px solid rgba(34,197,94,0.4); border-radius: 10px; padding: 8px 16px; font-size: clamp(13px, 1.5vw, 18px); color: var(--green); font-weight: 700; letter-spacing: 1.5px; font-family: 'Rajdhani', sans-serif; white-space: nowrap; min-height: 44px; display: flex; align-items: center; }
        .sync-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all var(--transition); }
        .sync-status:hover { background: rgba(255,255,255,0.1); }
        .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .sync-status .dot.synced { background: var(--green); }
        .sync-status .dot.unsynced { background: var(--orange); animation: pulse 1.5s ease-in-out infinite; }
        .sync-status .dot.error { background: var(--red); }
        .sync-status .dot.syncing { background: var(--blue); animation: pulse 0.8s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ======================== TABS ======================== */
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 2px; }
        .tab { flex: 1; min-width: 80px; padding: 14px 10px; text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(13px, 1.4vw, 18px); letter-spacing: 1px; color: #9ca3af; background: rgba(255,255,255,0.05); border: 2px solid transparent; cursor: pointer; border-bottom: 4px solid transparent; transition: all var(--transition); border-radius: 8px 8px 0 0; white-space: nowrap; min-height: var(--tab-height); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab:hover:not(.active) { color: #e5e7eb; background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .tab.active { color: #fff; background: #374151; border-bottom-color: var(--green); border-bottom-width: 4px; box-shadow: 0 4px 12px rgba(34,197,94,0.2); }
        .tab .tab-icon { font-size: clamp(16px, 1.6vw, 22px); }
        .tab .tab-label { font-weight: 700; }
        .tab .tab-short { display: none; }
        @media (max-width: 480px) { .tab .tab-full { display: none; } .tab .tab-short { display: inline; } .tab { min-width: 55px; padding: 10px 6px; font-size: clamp(11px, 2.5vw, 14px); min-height: 48px; } }

        /* ======================== MAIN CONTENT ======================== */
        .content { padding: 16px; max-width: 1200px; margin: 0 auto; }

        /* ======================== SECTION CARD ======================== */
        .section-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; transition: box-shadow var(--transition); border: 1px solid rgba(0,0,0,0.04); }
        .section-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #f8fafc; border-bottom: 2px solid var(--border); }
        .section-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .section-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(14px, 1.4vw, 18px); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); }

        /* ======================== FORM BODY ======================== */
        .form-body { padding: 16px 18px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .field-row.three-col { grid-template-columns: 1fr 1fr 1fr; }
        .field-row.four-col { grid-template-columns: 1fr 1fr 1fr 1fr; }
        .field { margin-bottom: 0; }
        .field label { display: block; font-size: clamp(10px, 1vw, 13px); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 5px; }
        .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: clamp(14px, 1.1vw, 16px); color: var(--text); background: #fafbfc; transition: all var(--transition); outline: none; -webkit-appearance: none; min-height: 48px; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,0.12); background: #fff; }
        .field textarea { resize: vertical; min-height: 60px; line-height: 1.6; }

        /* ======================== ITEMS TABLE ======================== */
        .items-table-wrap { overflow-x: auto; padding: 0 2px; -webkit-overflow-scrolling: touch; }
        .items-table { width: 100%; border-collapse: collapse; font-size: clamp(12px, 1vw, 14px); min-width: 650px; }
        .items-table thead tr { background: #f1f5f9; }
        .items-table th { padding: 14px 10px; text-align: left; font-family: 'Rajdhani', sans-serif; font-size: clamp(10px, 0.9vw, 13px); font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid var(--border); white-space: nowrap; }
        .items-table th.center, .items-table td.center { text-align: center; }
        .items-table th.right, .items-table td.right { text-align: right; }
        .items-table tbody tr { border-bottom: 2px solid #f1f5f9; transition: background var(--transition); }
        .items-table tbody tr:hover { background: #fafbfc; }
        .items-table td { padding: 8px 8px; vertical-align: middle; }
        .items-table td input { width: 100%; border: 2px solid transparent; border-radius: 6px; padding: 8px 8px; font-size: clamp(12px, 0.9vw, 14px); font-family: 'DM Sans', sans-serif; color: var(--text); background: transparent; outline: none; transition: all var(--transition); min-height: 40px; }
        .items-table td input:focus { border-color: var(--green); background: #fff; box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
        .items-table td input.desc { min-width: 100px; }
        .items-table td input.code { width: 60px; text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .items-table td input.kra-code { width: 70px; text-align: center; font-size: clamp(10px, 0.8vw, 12px); }
        .items-table td input.num { text-align: center; width: 50px; }
        .items-table td input.price { text-align: right; width: 80px; }
        .row-total { font-weight: 700; color: var(--text); font-size: clamp(12px, 1vw, 14px); white-space: nowrap; }
        .del-btn { background: none; border: 2px solid transparent; cursor: pointer; padding: 6px 12px; color: #f87171; font-size: clamp(20px, 1.8vw, 26px); border-radius: 8px; transition: all var(--transition); line-height: 1; min-height: 40px; min-width: 40px; display: flex; align-items: center; justify-content: center; }
        .del-btn:hover { background: #fef2f2; border-color: #fca5a5; transform: scale(1.1); }

        /* ======================== BUTTONS ======================== */
        .add-row-btn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 0; padding: 14px 20px; background: none; border: 3px dashed var(--green); border-radius: 12px; color: var(--green-dark); font-family: 'DM Sans', sans-serif; font-size: clamp(14px, 1.2vw, 18px); font-weight: 700; cursor: pointer; width: 100%; transition: all var(--transition); min-height: var(--btn-height); }
        .add-row-btn:hover { background: #dcfce7; border-color: var(--green-dark); transform: scale(1.01); }
        .add-row-btn:active { transform: scale(0.98); }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 4px 0; }
        .actions .full-width { grid-column: 1 / -1; }

        .btn-whatsapp, .btn-download, .btn-save, .btn-delete-all, .btn-sync {
            display: flex; align-items: center; justify-content: center; gap: 12px; border: none; border-radius: 14px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 2px; cursor: pointer;
            transition: all var(--transition); color: #fff; padding: 16px 20px;
            font-size: clamp(15px, 1.3vw, 20px); width: 100%; min-height: var(--btn-height); box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .btn-whatsapp { background: linear-gradient(135deg, #128c7e, #075e54); box-shadow: 0 4px 20px rgba(18,140,126,0.35); }
        .btn-whatsapp:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(18,140,126,0.45); }
        .btn-whatsapp:active { transform: translateY(0px) scale(0.98); }
        .btn-download { background: linear-gradient(135deg, #1a1a1a, #2d3748); box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
        .btn-download:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
        .btn-download:active { transform: translateY(0px) scale(0.98); }
        .btn-save { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 4px 20px rgba(37,99,235,0.35); }
        .btn-save:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(37,99,235,0.45); }
        .btn-save:active { transform: translateY(0px) scale(0.98); }
        .btn-delete-all { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 4px 20px rgba(220,38,38,0.35); }
        .btn-delete-all:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(220,38,38,0.45); }
        .btn-delete-all:active { transform: translateY(0px) scale(0.98); }
        .btn-sync { background: linear-gradient(135deg, #7c3aed, #6d28d9); box-shadow: 0 4px 20px rgba(124,58,237,0.35); }
        .btn-sync:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 32px rgba(124,58,237,0.45); }
        .btn-sync:active { transform: translateY(0px) scale(0.98); }
        .btn-icon { font-size: clamp(20px, 1.6vw, 28px); }

        /* ======================== SAVED PDFs SECTION ======================== */
        .pdf-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        .pdf-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 16px; background: #fafbfc; border-radius: 10px; border: 2px solid var(--border); transition: all var(--transition); }
        .pdf-item:hover { border-color: var(--green); background: #f0fdf4; }
        .pdf-item .pdf-info { display: flex; flex-direction: column; gap: 2px; }
        .pdf-item .pdf-name { font-weight: 700; font-size: clamp(13px, 1.1vw, 16px); color: var(--text); }
        .pdf-item .pdf-meta { font-size: clamp(10px, 0.8vw, 12px); color: var(--muted); }
        .pdf-item .pdf-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .pdf-item .pdf-btn { padding: 8px 14px; border: none; border-radius: 8px; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(10px, 0.8vw, 12px); cursor: pointer; transition: all var(--transition); display: flex; align-items: center; gap: 6px; min-height: 38px; }
        .pdf-item .pdf-btn-view { background: var(--blue); color: #fff; }
        .pdf-item .pdf-btn-view:hover { background: #2563eb; transform: scale(1.05); }
        .pdf-item .pdf-btn-delete { background: #fee2e2; color: #991b1b; }
        .pdf-item .pdf-btn-delete:hover { background: #fecaca; transform: scale(1.05); }
        .pdf-item .pdf-btn-sync { background: #ede9fe; color: #6d28d9; }
        .pdf-item .pdf-btn-sync:hover { background: #ddd6fe; transform: scale(1.05); }
        .pdf-empty { text-align: center; padding: 30px 20px; color: var(--muted); font-size: clamp(14px, 1.2vw, 18px); }
        .pdf-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .pdf-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
        .pdf-stats .stat { display: flex; align-items: center; gap: 8px; font-size: clamp(12px, 1vw, 14px); font-weight: 600; padding: 8px 16px; border-radius: 20px; background: #f1f5f9; }
        .pdf-stats .stat .num { font-size: clamp(18px, 1.5vw, 24px); }

        /* ======================== STATUS PILLS ======================== */
        .status-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
        .status-pill { padding: 8px 20px; border-radius: 24px; font-size: clamp(11px, 1vw, 15px); font-weight: 700; border: 2.5px solid var(--border); cursor: pointer; transition: all var(--transition); font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; background: #f8fafc; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
        .status-pill:hover { transform: scale(1.05); }
        .status-pill:active { transform: scale(0.95); }
        .status-pill.active-paid { background: #dcfce7; border-color: #22c55e; color: #15803d; box-shadow: 0 2px 12px rgba(34,197,94,0.2); }
        .status-pill.active-partial { background: #fef9c3; border-color: #eab308; color: #854d0e; box-shadow: 0 2px 12px rgba(234,179,8,0.2); }
        .status-pill.active-unpaid { background: #fee2e2; border-color: #ef4444; color: #991b1b; box-shadow: 0 2px 12px rgba(239,68,68,0.2); }
        .status-pill.active-in-progress { background: #dbeafe; border-color: #3b82f6; color: #1e40af; box-shadow: 0 2px 12px rgba(59,130,246,0.2); }
        .status-pill.active-completed { background: #dcfce7; border-color: #22c55e; color: #15803d; box-shadow: 0 2px 12px rgba(34,197,94,0.2); }

        /* ======================== TOTALS ======================== */
        .totals-block { margin-top: 14px; }
        .totals-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: clamp(13px, 1.1vw, 16px); color: var(--muted); border-bottom: 2px solid #f1f5f9; }
        .totals-row .val { font-weight: 700; color: var(--text); }
        .grand-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 16px 22px; background: var(--header-bg); border-radius: 12px; border: 2px solid rgba(34,197,94,0.2); }
        .grand-total-row .label { font-family: 'Rajdhani', sans-serif; font-size: clamp(15px, 1.4vw, 20px); font-weight: 700; letter-spacing: 2px; color: #9ca3af; text-transform: uppercase; }
        .grand-total-row .val { font-family: 'Rajdhani', sans-serif; font-size: clamp(22px, 2.2vw, 32px); font-weight: 700; color: var(--green); }
        .adj-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .adj-row label { font-size: clamp(12px, 1vw, 15px); color: var(--muted); font-weight: 700; min-width: 70px; }
        .adj-row input { width: 80px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: clamp(13px, 1vw, 16px); font-family: 'DM Sans', sans-serif; text-align: right; outline: none; transition: all var(--transition); min-height: 44px; }
        .adj-row input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
        .adj-row .adj-label { font-size: clamp(11px, 0.9vw, 14px); color: var(--muted); font-weight: 600; }

        /* ======================== KRA BADGE ======================== */
        .kra-badge { display: inline-flex; align-items: center; gap: 8px; background: #ecfdf5; border: 2px solid #a7f3d0; border-radius: 24px; padding: 6px 18px; font-size: clamp(11px, 1vw, 14px); color: #065f46; font-weight: 700; margin-bottom: 12px; min-height: 44px; }

        /* ======================== CHECKLIST ======================== */
        .checklist-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
        .checklist-item { display: grid; grid-template-columns: 1fr 70px 70px 60px; align-items: center; padding: 10px 14px; background: #fafbfc; border-radius: 10px; border: 2px solid #f1f5f9; gap: 6px; font-size: clamp(12px, 1vw, 14px); min-height: 52px; }
        .checklist-item .item-label { font-weight: 500; font-size: clamp(11px, 0.95vw, 14px); line-height: 1.4; }
        .checklist-item .item-status { display: flex; gap: 6px; justify-content: center; }
        .checklist-item .item-status label { display: flex; align-items: center; gap: 4px; font-size: clamp(9px, 0.8vw, 12px); font-weight: 700; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all var(--transition); }
        .checklist-item .item-status label:hover { background: #f1f5f9; }
        .checklist-item .item-status input[type="radio"] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; margin: 0; }
        .checklist-item .item-status input[type="radio"][value="defective"] { accent-color: #ef4444; }
        .checklist-item .item-status input[type="radio"][value="na"] { accent-color: #9ca3af; }
        .checklist-category { background: #f8fafc; padding: 10px 16px; border-radius: 10px; margin-top: 8px; font-weight: 700; font-size: clamp(11px, 1vw, 14px); color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; border-left: 4px solid var(--purple); min-height: 44px; display: flex; align-items: center; }
        .checklist-summary { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
        .checklist-summary .stat { display: flex; align-items: center; gap: 8px; font-size: clamp(12px, 1vw, 15px); font-weight: 700; padding: 8px 18px; border-radius: 24px; background: #f1f5f9; min-height: 44px; }
        .checklist-summary .stat .num { font-size: clamp(18px, 1.5vw, 24px); }
        .stat-good { color: #22c55e; }
        .stat-defective { color: #ef4444; }
        .stat-na { color: #9ca3af; }

        /* ======================== WORK ORDER SPECIFIC ======================== */
        .work-order-id { background: rgba(249,115,22,0.18); border: 2px solid rgba(249,115,22,0.4); border-radius: 10px; padding: 8px 16px; font-size: clamp(13px, 1.5vw, 18px); color: var(--orange); font-weight: 700; letter-spacing: 1.5px; font-family: 'Rajdhani', sans-serif; min-height: 44px; display: flex; align-items: center; }
        .wo-status-pill { padding: 8px 20px; border-radius: 24px; font-size: clamp(11px, 1vw, 15px); font-weight: 700; border: 2.5px solid var(--border); cursor: pointer; transition: all var(--transition); font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; background: #f8fafc; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
        .wo-status-pill:hover { transform: scale(1.05); }
        .wo-status-pill:active { transform: scale(0.95); }
        .wo-status-pill.active-pending { background: #fef3c7; border-color: #f59e0b; color: #92400e; box-shadow: 0 2px 12px rgba(245,158,11,0.2); }
        .wo-status-pill.active-in-progress { background: #dbeafe; border-color: #3b82f6; color: #1e40af; box-shadow: 0 2px 12px rgba(59,130,246,0.2); }

<script>
    // ================================================================
    // NEON DATABASE CONFIGURATION
    // ================================================================
    const NEON_CONFIG = {
        // Your Neon REST API endpoint
        baseUrl: 'https://ep-young-bird-amg5lpem.apirest.c-5.us-east-1.aws.neon.tech/neondb/rest/v1',
        
        // API Key for authentication (if required by Neon)
        // Get this from your Neon dashboard under "API Keys"
        apiKey: '', // Replace with your actual API key if needed
        
        // Table name for storing documents
        tableName: 'documents'
    };

    // ================================================================
    // NEON REST API SYNC ENGINE
    // ================================================================
    const NeonSync = {
        // Track sync status
        status: 'local', // 'local', 'synced', 'error', 'syncing'
        pendingSync: false,
        
        // Initialize sync engine
        init() {
            this.updateUI();
            // Check for pending documents that need syncing
            this.checkPendingSync();
            // Test connection
            this.testConnection();
        },
        
        // Update UI sync status
        updateUI() {
            const dot = document.getElementById('syncDot');
            const label = document.getElementById('syncLabel');
            if (!dot || !label) return;
            
            switch(this.status) {
                case 'synced':
                    dot.className = 'dot synced';
                    label.textContent = '☁️ Synced';
                    break;
                case 'error':
                    dot.className = 'dot error';
                    label.textContent = '⚠️ Error';
                    break;
                case 'syncing':
                    dot.className = 'dot syncing';
                    label.textContent = '⏳ Syncing…';
                    break;
                default:
                    dot.className = 'dot unsynced';
                    label.textContent = '💾 Local';
                    break;
            }
        },
        
        // Test connection to Neon
        async testConnection() {
            try {
                const response = await this.apiRequest('GET', '');
                if (response.ok) {
                    console.log('✅ Neon API connected successfully');
                    return true;
                } else {
                    console.warn('⚠️ Neon API connection test failed:', response.status);
                    this.status = 'error';
                    this.updateUI();
                    return false;
                }
            } catch (error) {
                console.warn('⚠️ Neon API connection error:', error.message);
                this.status = 'error';
                this.updateUI();
                return false;
            }
        },
        
        // Make a request to the Neon REST API
        async apiRequest(method, path, data = null) {
            const headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            };
            
            // Add API key if provided
            if (NEON_CONFIG.apiKey) {
                headers['Authorization'] = `Bearer ${NEON_CONFIG.apiKey}`;
            }
            
            const url = `${NEON_CONFIG.baseUrl}${path}`;
            
            const options = {
                method: method,
                headers: headers
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            const response = await fetch(url, options);
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Neon API error (${response.status}): ${errorText}`);
            }
            
            return response;
        },
        
        // Check if there are documents that need syncing
        checkPendingSync() {
            loadSavedPDFs();
            const unsynced = savedPDFs.filter(pdf => !pdf._synced);
            if (unsynced.length > 0) {
                this.pendingSync = true;
                this.status = 'local';
                this.updateUI();
            } else {
                this.pendingSync = false;
                this.status = 'synced';
                this.updateUI();
            }
        },
        
        // Sync a single document to Neon
        async syncDocument(pdf) {
            try {
                this.status = 'syncing';
                this.updateUI();
                
                // Prepare the document for sync
                const docData = {
                    id: pdf.id,
                    name: pdf.name,
                    type: pdf.type,
                    customer: pdf.customer || '',
                    vehicle: pdf.vehicle || '',
                    total: pdf.total || '',
                    date: pdf.date || new Date().toISOString(),
                    html_content: pdf.htmlContent || '',
                    synced_at: new Date().toISOString()
                };
                
                // Check if document already exists in Neon
                const checkResponse = await this.apiRequest('GET', `/${NEON_CONFIG.tableName}?id=eq.${encodeURIComponent(pdf.id)}`);
                const existingDocs = await checkResponse.json();
                
                let response;
                if (existingDocs && existingDocs.length > 0) {
                    // Update existing document
                    response = await this.apiRequest('PATCH', `/${NEON_CONFIG.tableName}?id=eq.${encodeURIComponent(pdf.id)}`, docData);
                } else {
                    // Insert new document
                    response = await this.apiRequest('POST', `/${NEON_CONFIG.tableName}`, docData);
                }
                
                if (response.ok) {
                    // Mark as synced locally
                    pdf._synced = true;
                    pdf._syncedAt = new Date().toISOString();
                    localStorage.setItem('sunhands_saved_pdfs', JSON.stringify(savedPDFs));
                    
                    this.status = 'synced';
                    this.updateUI();
                    showToast('✅ Document synced to cloud!', 3000);
                    return true;
                } else {
                    throw new Error(`Sync failed with status ${response.status}`);
                }
            } catch (error) {
                console.error('Sync error:', error);
                this.status = 'error';
                this.updateUI();
                showToast('⚠️ Sync failed: ' + error.message, 4000);
                return false;
            }
        },
        
        // Sync all unsynced documents
        async syncAll() {
            loadSavedPDFs();
            const unsynced = savedPDFs.filter(pdf => !pdf._synced);
            
            if (unsynced.length === 0) {
                showToast('✅ All documents are already synced!', 2000);
                return;
            }
            
            showToast(`🔄 Syncing ${unsynced.length} document(s)...`, 3000);
            
            let successCount = 0;
            for (const pdf of unsynced) {
                const success = await this.syncDocument(pdf);
                if (success) successCount++;
            }
            
            if (successCount === unsynced.length) {
                showToast(`✅ All ${successCount} document(s) synced successfully!`, 3000);
            } else {
                showToast(`⚠️ ${successCount}/${unsynced.length} documents synced.`, 4000);
            }
            
            this.checkPendingSync();
            if (currentTab === 'SAVEDPDFS') render();
        },
        
        // Load documents from Neon (pull)
        async pullFromNeon() {
            try {
                this.status = 'syncing';
                this.updateUI();
                showToast('📥 Pulling documents from cloud...', 3000);
                
                const response = await this.apiRequest('GET', `/${NEON_CONFIG.tableName}?order=synced_at.desc`);
                const documents = await response.json();
                
                if (documents && documents.length > 0) {
                    loadSavedPDFs();
                    
                    // Merge documents (avoid duplicates by id)
                    const existingIds = new Set(savedPDFs.map(p => p.id));
                    let addedCount = 0;
                    
                    for (const doc of documents) {
                        if (!existingIds.has(doc.id)) {
                            // Convert from database format to app format
                            const newDoc = {
                                id: doc.id,
                                name: doc.name,
                                type: doc.type,
                                customer: doc.customer || 'N/A',
                                vehicle: doc.vehicle || 'N/A',
                                total: doc.total || 'N/A',
                                date: doc.date || new Date().toISOString(),
                                htmlContent: doc.html_content || '',
                                _synced: true,
                                _syncedAt: doc.synced_at || new Date().toISOString()
                            };
                            savedPDFs.push(newDoc);
                            addedCount++;
                        } else {
                            // Update existing document's sync status
                            const existing = savedPDFs.find(p => p.id === doc.id);
                            if (existing) {
                                existing._synced = true;
                                existing._syncedAt = doc.synced_at || new Date().toISOString();
                            }
                        }
                    }
                    
                    if (addedCount > 0) {
                        localStorage.setItem('sunhands_saved_pdfs', JSON.stringify(savedPDFs));
                        showToast(`📥 Pulled ${addedCount} new document(s) from cloud!`, 3000);
                    } else {
                        showToast('✅ Already up to date with cloud.', 2000);
                    }
                    
                    this.status = 'synced';
                    this.updateUI();
                    if (currentTab === 'SAVEDPDFS') render();
                    return true;
                } else {
                    showToast('📭 No documents found in cloud.', 2000);
                    this.status = 'synced';
                    this.updateUI();
                    return false;
                }
            } catch (error) {
                console.error('Pull error:', error);
                this.status = 'error';
                this.updateUI();
                showToast('⚠️ Failed to pull from cloud: ' + error.message, 4000);
                return false;
            }
        }
    };

    // ================================================================

    (function registerServiceWorker() {
        const swCode = `
            const CACHE_NAME = 'sunhands-v1';
            const ASSETS = [
                '/',
                '/manifest.json',
                'https://i.ibb.co/0RQfKqkW/1777590981480.png',
                'https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap',
                'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
            ];
            self.addEventListener('install', event => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then(cache => cache.addAll(ASSETS))
                        .then(() => self.skipWaiting())
                );
            });
            self.addEventListener('activate', event => {
                event.waitUntil(
                    caches.keys().then(keys => {
                        return Promise.all(
                            keys.filter(key => key !== CACHE_NAME)
                                .map(key => caches.delete(key))
                        );
                    }).then(() => self.clients.claim())
                );
            });
            self.addEventListener('fetch', event => {
                event.respondWith(
                    caches.match(event.request)
                        .then(cached => cached || fetch(event.request))
                );
            });
        `;

        try {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register(swUrl)
                        .then(reg => console.log('SW (blob) registered:', reg))
                        .catch(() => {
                            navigator.serviceWorker.register('/sw.js')
                                .then(reg => console.log('SW (fallback) registered:', reg))
                                .catch(err => console.warn('SW registration failed:', err));
                        });
                });
            }
        } catch (e) {
            console.warn('SW blob registration not supported, falling back to external sw.js');
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .catch(err => console.warn('SW registration failed:', err));
                });
            }
        }
    })();

                script2.onload = () => {
                    pdfLibsLoaded = true;
                    resolve();
                };
                script2.onerror = reject;
                document.head.appendChild(script2);
            };
            script1.onerror = reject;
            document.head.appendChild(script1);
        });
    }

    // ─── SHARING & DOWNLOAD FUNCTIONS ──────────────
    async function generateAndSharePDF() {
        const loadingEl = document.getElementById('loadingOverlay');
        loadingEl.classList.remove('hidden');
        showToast('📄 Generating PDF…', 4000);
        try {
            await loadPdfLibs();
            renderPDFTemplate();
            const templateEl = document.getElementById('pdfTemplate');
            await new Promise(r => setTimeout(r, 400));
            const canvas = await html2canvas(templateEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                width: templateEl.scrollWidth,
                height: templateEl.scrollHeight
            });
            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/png');
            const pdfWidth = 210;
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, Math.min(pdfHeight, 297));
            if (pdfHeight > 297) { let rem = pdfHeight - 297; while (rem > 0) { pdf.addPage(); pdf.addImage(imgData, 'PNG', 0, -(297 * (pdf.getNumberOfPages() - 1)), pdfWidth, pdfHeight); rem -= 297; } }
            const pdfBlob = pdf.output('blob');
            let docId;
            if (currentTab === 'WORKORDER') docId = woData.woNumber;
            else if (currentTab === 'CHECKLIST') docId = 'CL-2026-0048';
            else docId = formData.invoiceNo;
            const pdfName = `Sunhands_${currentTab}_${docId.replace(/[/#]/g,'_')}.pdf`;
            const file = new File([pdfBlob], pdfName, { type: 'application/pdf' });
            const shareText = currentTab === 'CHECKLIST' ?
                `*SUNHANDS AUTO CARE*\n📋 VEHICLE CHECKLIST\n🔍 Inspector: ${checklistData.inspectorName}\n🚗 ${checklistData.vehicleType} (${checklistData.licensePlate})\n📅 ${checklistData.date}` :
                `*SUNHANDS AUTO CARE*\n📄 ${currentTab === 'WORKORDER' ? 'WORK ORDER' : currentTab}: ${docId}\n👤 ${formData.custName}\n🚗 ${formData.vehicleReg}\n💰 Grand Total: ${fmt(calcTotals().grand)}\n📅 ${formData.date}`;

            try {
                await navigator.share({
                    title: `Sunhands Auto Care — ${docId}`,
                    text: shareText,
                    files: [file]
                });
                showToast('✅ PDF shared!', 3000);
            } catch (shareError) {
                console.log('Native share failed, falling back to download + WhatsApp text', shareError);
                const url = URL.createObjectURL(pdfBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = pdfName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('📥 PDF downloaded! Opening WhatsApp…', 4000);
                setTimeout(() => {

                }, 900);
            }

    async function downloadPDF() {
        const loadingEl = document.getElementById('loadingOverlay');
        loadingEl.classList.remove('hidden');
        showToast('📄 Preparing PDF…', 3000);
        try {
            await loadPdfLibs();
            renderPDFTemplate();
            const templateEl = document.getElementById('pdfTemplate');
            await new Promise(r => setTimeout(r, 400));
            const canvas = await html2canvas(templateEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                width: templateEl.scrollWidth,
                height: templateEl.scrollHeight
            });
            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/png');
            const pdfWidth = 210;
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, Math.min(pdfHeight, 297));
            if (pdfHeight > 297) { let rem = pdfHeight - 297; while (rem > 0) { pdf.addPage(); pdf.addImage(imgData, 'PNG', 0, -(297 * (pdf.getNumberOfPages() - 1)), pdfWidth, pdfHeight); rem -= 297; } }
            let docId;
            if (currentTab === 'WORKORDER') docId = woData.woNumber;
            else if (currentTab === 'CHECKLIST') docId = 'CL-2026-0048';
            else docId = formData.invoiceNo;
            pdf.save(`Sunhands_${currentTab}_${docId.replace(/[/#]/g,'_')}.pdf`);
            showToast('✅ PDF downloaded!', 2500);
        } catch (err) { console.error(err); showToast('⚠️ Download failed.', 3000); } finally { loadingEl.classList.add('hidden'); document.getElementById('pdfTemplate').innerHTML = ''; }
    }

    // ─── HELPERS ──────────────────────────────────
    function fmt(n) { return 'KSH ' + Number(n).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtPlain(n) { return Number(n).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function calcTotals() {
        const sub = lineItems.reduce((s, it) => s + (it.qty * it.price), 0);
        const disc = sub * (discountPct / 100);
        const afterDisc = sub - disc;
        const tax = afterDisc * (taxPct / 100);
        const grand = afterDisc + tax;
        return { sub, disc, afterDisc, tax, grand };
    }

    function showToast(msg, d = 2500) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'flex';
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, d);
    }

    function switchTab(tab, el) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        if (tab === 'WORKORDER') {
            document.getElementById('docNumber').textContent = woData.woNumber;
        } else if (tab === 'CHECKLIST') {
            document.getElementById('docNumber').textContent = 'CL-2026-0048';
        } else if (tab === 'SAVEDPDFS') {
            loadSavedPDFs();
            document.getElementById('docNumber').textContent = `📁 ${savedPDFs.length} PDFs`;
        } else {
            formData.invoiceNo = prefixes[tab] + docNumSuffix[tab];
            document.getElementById('docNumber').textContent = formData.invoiceNo;
        }
        if (tab === 'RECEIPT') paymentStatus = 'paid';
        render();
    }

        if (lineItems.length <= 1) { showToast('⚠️ At least one item required'); return; }
        lineItems = lineItems.filter(i => i.id !== id);
        render();
    }

    function updateItem(id, field, val) {
        const item = lineItems.find(i => i.id === id);
        if (!item) return;
        if (field === 'qty' || field === 'price') item[field] = parseFloat(val) || 0;
        else item[field] = val;
        updateTotals();
    }

    function updateTotals() {
        const { sub, disc, tax, grand } = calcTotals();
        const el = (id) => document.getElementById(id);
        if (el('valSubtotal')) el('valSubtotal').textContent = fmt(sub);
        if (el('valDiscount')) el('valDiscount').textContent = discountPct > 0 ? `-${fmt(disc)}` : '—';
        if (el('valTax')) el('valTax').textContent = fmt(tax);
        if (el('valGrand')) el('valGrand').textContent = fmt(grand);
        lineItems.forEach(item => {
            const el2 = document.getElementById('rowTotal_' + item.id);
            if (el2) el2.textContent = fmt(item.qty * item.price);
        });
    }

    function updateDiscount(v) { discountPct = parseFloat(v) || 0; updateTotals(); }
    function updateTax(v) { taxPct = parseFloat(v) || 0; updateTotals(); }

    // Export all saved documents as HTML files
    function exportAllPDFs() {
        if (savedPDFs.length === 0) {
            showToast('📭 No documents to export', 2000);
            return;
        }
        showToast(`📦 Exporting ${savedPDFs.length} documents...`, 3000);
        savedPDFs.forEach((pdf, index) => {
            setTimeout(() => {
                const blob = new Blob([pdf.htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = pdf.name.replace(/\s+/g, '_') + '.html';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                if (index === savedPDFs.length - 1) {
                    showToast('✅ All documents exported!', 2000);
                }
            }, index * 500);
        });
    }

                <div class="field-row two-col"><div class="field"><label>${currentTab} Number</label><input value="${formData.invoiceNo}" oninput="updateField('invoiceNo',this.value)"></div><div class="field"><label>Date</label><input type="date" value="${formData.date}" oninput="updateField('date',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>Due Date</label><input value="${formData.dueDate}" oninput="updateField('dueDate',this.value)"></div><div class="field"><label>Status</label><div class="status-pills">${['paid','partial','unpaid'].map(s=>`<button class="status-pill${paymentStatus===s?' active-'+s:''}" id="pill_${s}" onclick="setPayment('${s}')">${s.toUpperCase()}</button>`).join('')}</div></div></div>
                ${currentTab==='RECEIPT'?`<div class="field-row two-col"><div class="field"><label>Method</label><select onchange="window._pm=this.value"><option>MPESA</option><option>Bank</option><option>Cash</option></select></div><div class="field"><label>Ref</label><input value="${paymentRef}" oninput="window._pr=this.value"></div></div>`:''}
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Vehicle</span></div><div class="form-body">
                <div class="field-row two-col"><div class="field"><label>Reg</label><input value="${formData.vehicleReg}" oninput="updateField('vehicleReg',this.value)"></div><div class="field"><label>Year</label><input value="${formData.year}" oninput="updateField('year',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>Make</label><input value="${formData.make}" oninput="updateField('make',this.value)"></div><div class="field"><label>Model</label><input value="${formData.model}" oninput="updateField('model',this.value)"></div></div>
                <div class="field"><label>Mileage</label><input value="${formData.mileage}" oninput="updateField('mileage',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Customer</span></div><div class="form-body">
                <div class="field"><label>Name</label><input value="${formData.custName}" oninput="updateField('custName',this.value)"></div>
                <div class="field-row two-col"><div class="field"><label>Phone</label><input value="${formData.custPhone}" oninput="updateField('custPhone',this.value)"></div><div class="field"><label>Email</label><input value="${formData.custEmail}" oninput="updateField('custEmail',this.value)"></div></div>
                <div class="field"><label>Address</label><input value="${formData.custAddress}" oninput="updateField('custAddress',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Line Items</span></div>
                <div class="items-table-wrap"><table class="items-table"><thead><tr><th>Code</th><th>Description</th><th class="center">Qty</th><th class="right">Unit Price</th><th class="center">KRA</th><th class="right">Total</th><th></th></tr></thead><tbody>
                    ${lineItems.map(item=>`<tr><td><input class="code" value="${item.code||''}" oninput="updateItem(${item.id},'code',this.value)"></td><td><input class="desc" value="${item.description}" oninput="updateItem(${item.id},'description',this.value)"></td><td class="center"><input class="num" type="number" min="1" value="${item.qty}" oninput="updateItem(${item.id},'qty',this.value)"></td><td class="right"><input class="price" type="number" min="0" step="50" value="${item.price}" oninput="updateItem(${item.id},'price',this.value)"></td><td class="center"><input class="kra-code" value="${item.kraCode||''}" oninput="updateItem(${item.id},'kraCode',this.value)"></td><td class="right"><span class="row-total" id="rowTotal_${item.id}">${fmt(item.qty*item.price)}</span></td><td><button class="del-btn" onclick="removeItem(${item.id})">×</button></td></tr>`).join('')}
                </tbody></table></div>
                <div style="padding:4px 14px 14px"><button class="add-row-btn" onclick="addItem()">➕ Add Line Item</button>
                <div class="divider"></div>
                <div class="adj-row"><label>Discount</label><input type="number" min="0" max="100" value="${discountPct}" oninput="updateDiscount(this.value)"><span class="adj-label">%</span></div>
                <div class="adj-row"><label>VAT</label><input type="number" min="0" max="100" value="${taxPct}" oninput="updateTax(this.value)"><span class="adj-label">%</span></div>
                <div class="totals-block"><div class="totals-row"><span>Subtotal</span><span id="valSubtotal">${fmt(sub)}</span></div><div class="totals-row"><span>Discount</span><span id="valDiscount">${discountPct>0?'-'+fmt(disc):'—'}</span></div><div class="totals-row"><span>VAT</span><span id="valTax">${fmt(tax)}</span></div></div>
                <div class="grand-total-row"><span class="label">GRAND TOTAL</span><span class="val" id="valGrand">${fmt(grand)}</span></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Payment Details</span></div><div class="form-body">
                <div class="field-row two-col"><div class="field"><label>Bank</label><input value="${formData.bankName}" oninput="updateField('bankName',this.value)"></div><div class="field"><label>Account</label><input value="${formData.bankAccount}" oninput="updateField('bankAccount',this.value)"></div></div>
                <div class="field"><label>M-Pesa Paybill</label><input value="${formData.mpesaPaybill}" oninput="updateField('mpesaPaybill',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">KRA Compliance</span></div><div class="form-body">
                <div class="kra-badge">🔒 KRA Registered</div>
                <div class="field-row two-col"><div class="field"><label>PIN</label><input value="${formData.kraPin}" oninput="updateField('kraPin',this.value)"></div><div class="field"><label>VAT</label><input value="${formData.vatNo}" oninput="updateField('vatNo',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>ETR Serial</label><input value="${formData.etrSerial}" oninput="updateField('etrSerial',this.value)"></div><div class="field"><label>Fiscalised ID</label><input value="${formData.fiscalisedId}" oninput="updateField('fiscalisedId',this.value)"></div></div>
                <div class="field"><label>Control Code</label><input value="${formData.controlCode}" oninput="updateField('controlCode',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Notes & Terms</span></div><div class="form-body">
                <div class="field"><label>Notes</label><textarea rows="2" oninput="updateField('notes',this.value)">${formData.notes}</textarea></div>
                <div class="field"><label>Terms</label><textarea rows="2" oninput="updateField('terms',this.value)">${formData.terms}</textarea></div>
            </div></div>
            <div class="section-card"><div class="form-body actions">
                <button class="btn-whatsapp" onclick="generateAndSharePDF()"><span class="btn-icon">📤</span> SHARE TO WHATSAPP</button>
                <button class="btn-download" onclick="downloadPDF()"><span class="btn-icon">⬇</span> DOWNLOAD PDF</button>
                <button class="btn-save full-width" onclick="generateAndSavePDF()"><span class="btn-icon">💾</span> SAVE DOCUMENT</button>
            </div></div>`;
    }

    // ─── WATCH FOR DYNAMIC CHANGES ──────────────────
    setInterval(() => {
        if (window._pm) paymentMethod = window._pm;
        if (window._pr) paymentRef = window._pr;
    }, 500);

    // ─── GLOBAL EXPOSURE ────────────────────────────
    window.handleFloatingShare = handleFloatingShare;
    window.switchTab = switchTab;
    window.addItem = addItem;
    window.removeItem = removeItem;
    window.updateItem = updateItem;
    window.updateDiscount = updateDiscount;
    window.updateTax = updateTax;
    window.setPayment = setPayment;
    window.updateField = updateField;
    window.generateAndSharePDF = generateAndSharePDF;
    window.downloadPDF = downloadPDF;
    window.generateAndSavePDF = generateAndSavePDF;
    window.setWOStatus = setWOStatus;
    window.updateWOField = updateWOField;
    window.updateChecklistField = updateChecklistField;
    window.updateChecklistItem = updateChecklistItem;
    window.deleteSavedPDF = deleteSavedPDF;
    window.deleteAllPDFs = deleteAllPDFs;
    window.viewSavedPDF = viewSavedPDF;
    window.exportAllPDFs = exportAllPDFs;
    window.syncSavedPDF = syncSavedPDF;
    window.syncAllToNeon = syncAllToNeon;
    window.pullFromNeon = pullFromNeon;

    // ─── INITIALIZE ──────────────────────────────────
    loadSavedPDFs();
    NeonSync.init();
    render();
</script>
</body>
</html>
