<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sunhands Auto Care — Complete Workshop Management</title>

    <!-- ===================== PWA: Manifest ===================== -->
    <script>
        (function() {
            const manifest = {
                "name": "Sunhands Auto Care",
                "short_name": "Sunhands",
                "description": "Quotations, Invoices, Receipts, Work Orders & Vehicle Checklists",
                "start_url": window.location.href.split('?')[0],
                "display": "standalone",
                "background_color": "#f0f2f5",
                "theme_color": "#111827",
                "orientation": "portrait",
                "icons": [
                    {
                        "src": "https://i.ibb.co/0RQfKqkW/1777590981480.png",
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": "https://i.ibb.co/0RQfKqkW/1777590981480.png",
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ======================== ROOT VARIABLES ======================== */
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --bg: #f0f2f5;
            --card: #fff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --header-bg: #111827;
            --gold: #d4a843;
            --orange: #f97316;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --radius: 14px;
            --shadow: 0 1px 8px rgba(0,0,0,0.06);
            --transition: 0.2s ease;
            --tab-height: 56px;
            --btn-height: 56px;
            --font-large: 16px;
            --font-xl: 18px;
        }

        /* ======================== RESET & BASE ======================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        /* ======================== HEADER ======================== */
        .app-header {
            background: var(--header-bg);
            padding: 14px 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a1f2b;
            border: 2px solid rgba(212,168,67,0.5);
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .logo-text {
            flex: 1;
            min-width: 160px;
        }
        .logo-text .brand {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(18px, 3.5vw, 26px);
            color: #fff;
            letter-spacing: 2px;
            line-height: 1.1;
        }
        .logo-text .tagline {
            font-size: clamp(10px, 1.4vw, 13px);
            color: var(--gold);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .doc-number {
            background: rgba(34,197,94,0.18);
            border: 2px solid rgba(34,197,94,0.4);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: clamp(13px, 1.5vw, 18px);
            color: var(--green);
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Rajdhani', sans-serif;
            white-space: nowrap;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        /* ======================== TABS - ULTRA LARGE & VISIBLE ======================== */
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-bottom: 2px;
        }
        .tab {
            flex: 1;
            min-width: 80px;
            padding: 14px 10px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(13px, 1.4vw, 18px);
            letter-spacing: 1px;
            color: #9ca3af;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            transition: all var(--transition);
            border-radius: 8px 8px 0 0;
            white-space: nowrap;
            min-height: var(--tab-height);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab:hover:not(.active) {
            color: #e5e7eb;
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        .tab.active {
            color: #fff;
            background: #374151;
            border-bottom-color: var(--green);
            border-bottom-width: 4px;
            box-shadow: 0 4px 12px rgba(34,197,94,0.2);
        }
        .tab .tab-icon {
            font-size: clamp(16px, 1.6vw, 22px);
        }

        /* Tab label with emoji for better visibility */
        .tab .tab-label {
            font-weight: 700;
        }
        .tab .tab-short {
            display: none;
        }
        @media (max-width: 480px) {
            .tab .tab-full {
                display: none;
            }
            .tab .tab-short {
                display: inline;
            }
            .tab {
                min-width: 55px;
                padding: 10px 6px;
                font-size: clamp(11px, 2.5vw, 14px);
                min-height: 48px;
            }
        }

        /* ======================== MAIN CONTENT ======================== */
        .content {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ======================== SECTION CARD ======================== */
        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            overflow: hidden;
            transition: box-shadow var(--transition);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .section-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
        }
        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }
        .section-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(14px, 1.4vw, 18px);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text);
        }

        /* ======================== FORM BODY ======================== */
        .form-body {
            padding: 16px 18px;
        }
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .field-row.three-col {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .field-row.four-col {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .field {
            margin-bottom: 0;
        }
        .field label {
            display: block;
            font-size: clamp(10px, 1vw, 13px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(14px, 1.1vw, 16px);
            color: var(--text);
            background: #fafbfc;
            transition: all var(--transition);
            outline: none;
            -webkit-appearance: none;
            min-height: 48px;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
            background: #fff;
        }
        .field textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.6;
        }

        /* ======================== ITEMS TABLE ======================== */
        .items-table-wrap {
            overflow-x: auto;
            padding: 0 2px;
            -webkit-overflow-scrolling: touch;
        }
        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(12px, 1vw, 14px);
            min-width: 650px;
        }
        .items-table thead tr {
            background: #f1f5f9;
        }
        .items-table th {
            padding: 14px 10px;
            text-align: left;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(10px, 0.9vw, 13px);
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 3px solid var(--border);
            white-space: nowrap;
        }
        .items-table th.center,
        .items-table td.center {
            text-align: center;
        }
        .items-table th.right,
        .items-table td.right {
            text-align: right;
        }
        .items-table tbody tr {
            border-bottom: 2px solid #f1f5f9;
            transition: background var(--transition);
        }
        .items-table tbody tr:hover {
            background: #fafbfc;
        }
        .items-table td {
            padding: 8px 8px;
            vertical-align: middle;
        }
        .items-table td input {
            width: 100%;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 8px 8px;
            font-size: clamp(12px, 0.9vw, 14px);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background: transparent;
            outline: none;
            transition: all var(--transition);
            min-height: 40px;
        }
        .items-table td input:focus {
            border-color: var(--green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
        }
        .items-table td input.desc {
            min-width: 100px;
        }
        .items-table td input.code {
            width: 60px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .items-table td input.kra-code {
            width: 70px;
            text-align: center;
            font-size: clamp(10px, 0.8vw, 12px);
        }
        .items-table td input.num {
            text-align: center;
            width: 50px;
        }
        .items-table td input.price {
            text-align: right;
            width: 80px;
        }
        .row-total {
            font-weight: 700;
            color: var(--text);
            font-size: clamp(12px, 1vw, 14px);
            white-space: nowrap;
        }
        .del-btn {
            background: none;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 6px 12px;
            color: #f87171;
            font-size: clamp(20px, 1.8vw, 26px);
            border-radius: 8px;
            transition: all var(--transition);
            line-height: 1;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .del-btn:hover {
            background: #fef2f2;
            border-color: #fca5a5;
            transform: scale(1.1);
        }

        /* ======================== BUTTONS - ULTRA LARGE & VISIBLE ======================== */
        .add-row-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px 0 0;
            padding: 14px 20px;
            background: none;
            border: 3px dashed var(--green);
            border-radius: 12px;
            color: var(--green-dark);
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(14px, 1.2vw, 18px);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all var(--transition);
            min-height: var(--btn-height);
        }
        .add-row-btn:hover {
            background: #dcfce7;
            border-color: var(--green-dark);
            transform: scale(1.01);
        }
        .add-row-btn:active {
            transform: scale(0.98);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 4px 0;
        }
        .actions .full-width {
            grid-column: 1 / -1;
        }

        .btn-whatsapp,
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: none;
            border-radius: 14px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all var(--transition);
            color: #fff;
            padding: 16px 20px;
            font-size: clamp(15px, 1.3vw, 20px);
            width: 100%;
            min-height: var(--btn-height);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .btn-whatsapp {
            background: linear-gradient(135deg, #128c7e, #075e54);
            box-shadow: 0 4px 20px rgba(18,140,126,0.35);
        }
        .btn-whatsapp:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(18,140,126,0.45);
        }
        .btn-whatsapp:active {
            transform: translateY(0px) scale(0.98);
        }
        .btn-download {
            background: linear-gradient(135deg, #1a1a1a, #2d3748);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .btn-download:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        .btn-download:active {
            transform: translateY(0px) scale(0.98);
        }

        /* Button icons */
        .btn-icon {
            font-size: clamp(20px, 1.6vw, 28px);
        }

        /* ======================== STATUS PILLS - LARGER ======================== */
        .status-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .status-pill {
            padding: 8px 20px;
            border-radius: 24px;
            font-size: clamp(11px, 1vw, 15px);
            font-weight: 700;
            border: 2.5px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            background: #f8fafc;
            color: var(--muted);
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .status-pill:hover {
            transform: scale(1.05);
        }
        .status-pill:active {
            transform: scale(0.95);
        }
        .status-pill.active-paid {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            box-shadow: 0 2px 12px rgba(34,197,94,0.2);
        }
        .status-pill.active-partial {
            background: #fef9c3;
            border-color: #eab308;
            color: #854d0e;
            box-shadow: 0 2px 12px rgba(234,179,8,0.2);
        }
        .status-pill.active-unpaid {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
            box-shadow: 0 2px 12px rgba(239,68,68,0.2);
        }
        .status-pill.active-in-progress {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
            box-shadow: 0 2px 12px rgba(59,130,246,0.2);
        }
        .status-pill.active-completed {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            box-shadow: 0 2px 12px rgba(34,197,94,0.2);
        }

        /* ======================== TOTALS ======================== */
        .totals-block {
            margin-top: 14px;
        }
        .totals-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: clamp(13px, 1.1vw, 16px);
            color: var(--muted);
            border-bottom: 2px solid #f1f5f9;
        }
        .totals-row .val {
            font-weight: 700;
            color: var(--text);
        }

        .grand-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 16px 22px;
            background: var(--header-bg);
            border-radius: 12px;
            border: 2px solid rgba(34,197,94,0.2);
        }
        .grand-total-row .label {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(15px, 1.4vw, 20px);
            font-weight: 700;
            letter-spacing: 2px;
            color: #9ca3af;
            text-transform: uppercase;
        }
        .grand-total-row .val {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(22px, 2.2vw, 32px);
            font-weight: 700;
            color: var(--green);
        }

        .adj-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .adj-row label {
            font-size: clamp(12px, 1vw, 15px);
            color: var(--muted);
            font-weight: 700;
            min-width: 70px;
        }
        .adj-row input {
            width: 80px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: clamp(13px, 1vw, 16px);
            font-family: 'DM Sans', sans-serif;
            text-align: right;
            outline: none;
            transition: all var(--transition);
            min-height: 44px;
        }
        .adj-row input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
        }
        .adj-row .adj-label {
            font-size: clamp(11px, 0.9vw, 14px);
            color: var(--muted);
            font-weight: 600;
        }

        /* ======================== KRA BADGE ======================== */
        .kra-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ecfdf5;
            border: 2px solid #a7f3d0;
            border-radius: 24px;
            padding: 6px 18px;
            font-size: clamp(11px, 1vw, 14px);
            color: #065f46;
            font-weight: 700;
            margin-bottom: 12px;
            min-height: 44px;
        }

        /* ======================== CHECKLIST ======================== */
        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .checklist-item {
            display: grid;
            grid-template-columns: 1fr 70px 70px 60px;
            align-items: center;
            padding: 10px 14px;
            background: #fafbfc;
            border-radius: 10px;
            border: 2px solid #f1f5f9;
            gap: 6px;
            font-size: clamp(12px, 1vw, 14px);
            min-height: 52px;
        }
        .checklist-item .item-label {
            font-weight: 500;
            font-size: clamp(11px, 0.95vw, 14px);
            line-height: 1.4;
        }
        .checklist-item .item-status {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .checklist-item .item-status label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: clamp(9px, 0.8vw, 12px);
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all var(--transition);
        }
        .checklist-item .item-status label:hover {
            background: #f1f5f9;
        }
        .checklist-item .item-status input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--green);
            cursor: pointer;
            margin: 0;
        }
        .checklist-item .item-status input[type="radio"][value="defective"] {
            accent-color: #ef4444;
        }
        .checklist-item .item-status input[type="radio"][value="na"] {
            accent-color: #9ca3af;
        }
        .checklist-category {
            background: #f8fafc;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: 700;
            font-size: clamp(11px, 1vw, 14px);
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-left: 4px solid var(--purple);
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .checklist-summary {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .checklist-summary .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(12px, 1vw, 15px);
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 24px;
            background: #f1f5f9;
            min-height: 44px;
        }
        .checklist-summary .stat .num {
            font-size: clamp(18px, 1.5vw, 24px);
        }
        .stat-good {
            color: #22c55e;
        }
        .stat-defective {
            color: #ef4444;
        }
        .stat-na {
            color: #9ca3af;
        }

        /* ======================== WORK ORDER SPECIFIC ======================== */
        .work-order-id {
            background: rgba(249,115,22,0.18);
            border: 2px solid rgba(249,115,22,0.4);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: clamp(13px, 1.5vw, 18px);
            color: var(--orange);
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Rajdhani', sans-serif;
            min-height: 44px;
            display: flex;

    (function registerServiceWorker() {
        const swCode = `
            const CACHE_NAME = 'sunhands-v1';
            const ASSETS = [
                '/',
                '/manifest.json',
                'https://i.ibb.co/0RQfKqkW/1777590981480.png',
                'https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap',

                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
            ];
            self.addEventListener('install', event => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then(cache => cache.addAll(ASSETS))
                        .then(() => self.skipWaiting())
                );
            });
            self.addEventListener('activate', event => {
                event.waitUntil(
                    caches.keys().then(keys => {
                        return Promise.all(
                            keys.filter(key => key !== CACHE_NAME)
                                .map(key => caches.delete(key))
                        );
                    }).then(() => self.clients.claim())
                );
            });
            self.addEventListener('fetch', event => {
                event.respondWith(
                    caches.match(event.request)
                        .then(cached => cached || fetch(event.request))
                );
            });
        `;

        try {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register(swUrl)
                        .then(reg => console.log('SW (blob) registered:', reg))
                        .catch(() => {
                            navigator.serviceWorker.register('/sw.js')
                                .then(reg => console.log('SW (fallback) registered:', reg))
                                .catch(err => console.warn('SW registration failed:', err));
                        });
                });
            }
        } catch (e) {
            console.warn('SW blob registration not supported, falling back to external sw.js');
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .catch(err => console.warn('SW registration failed:', err));
                });
            }

    // ─── WHATSAPP SHARING & PDF GENERATION ────────────
    async function generateAndSharePDF() {
        const loadingEl = document.getElementById('loadingOverlay');
        loadingEl.classList.remove('hidden');
        showToast('📄 Generating PDF…', 4000);
        try {
            await loadPdfLibs();
            renderPDFTemplate();
            const templateEl = document.getElementById('pdfTemplate');
            await new Promise(r => setTimeout(r, 400));
            const canvas = await html2canvas(templateEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                width: templateEl.scrollWidth,
                height: templateEl.scrollHeight
            });
            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/png');
            const pdfWidth = 210;
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, Math.min(pdfHeight, 297));
            if (pdfHeight > 297) { let rem = pdfHeight - 297; while (rem > 0) { pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, -(297 * (pdf.getNumberOfPages() - 1)), pdfWidth, pdfHeight);
                    rem -= 297; } }
            const pdfBlob = pdf.output('blob');
            let docId;
            if (currentTab === 'WORKORDER') docId = woData.woNumber;
            else if (currentTab === 'CHECKLIST') docId = 'CL-2026-0048';
            else docId = formData.invoiceNo;
            const pdfName = `Sunhands_${currentTab}_${docId.replace(/[/#]/g,'_')}.pdf`;
            const file = new File([pdfBlob], pdfName, { type: 'application/pdf' });
            const shareText = currentTab === 'CHECKLIST' ?
                `*SUNHANDS AUTO CARE*\n📋 VEHICLE CHECKLIST\n🔍 Inspector: ${checklistData.inspectorName}\n🚗 ${checklistData.vehicleType} (${checklistData.licensePlate})\n📅 ${checklistData.date}` :
                `*SUNHANDS AUTO CARE*\n📄 ${currentTab === 'WORKORDER' ? 'WORK ORDER' : currentTab}: ${docId}\n👤 ${formData.custName}\n🚗 ${formData.vehicleReg}\n💰 Grand Total: ${fmt(calcTotals().grand)}\n📅 ${formData.date}`;

            try {
                await navigator.share({
                    title: `Sunhands Auto Care — ${docId}`,
                    text: shareText,
                    files: [file]
                });
                showToast('✅ PDF shared!', 3000);
            } catch (shareError) {
                console.log('Native share failed, falling back to download + WhatsApp text', shareError);
                const url = URL.createObjectURL(pdfBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = pdfName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('📥 PDF downloaded! Opening WhatsApp…', 4000);
                setTimeout(() => {
                    window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
                }, 900);
            }
        } catch (err) {
            console.error(err);
            showToast('⚠️ Could not generate PDF. Try again.', 3500);
        } finally {
            loadingEl.classList.add('hidden');
            document.getElementById('pdfTemplate').innerHTML = '';
        }
    }

                    <div class="field-row three-col"><div class="field"><label>Date</label><input type="date" value="${formData.date}" oninput="updateField('date',this.value)"></div><div class="field"><label>Priority</label><select oninput="updateWOField('priority',this.value)"><option ${woData.priority==='Low'?'selected':''}>Low</option><option ${woData.priority==='Normal'?'selected':''}>Normal</option><option ${woData.priority==='High'?'selected':''}>High</option><option ${woData.priority==='Urgent'?'selected':''}>Urgent</option></select></div><div class="field"><label>Status</label><div class="status-pills">${['pending','in-progress','completed','cancelled'].map(s=>`<button class="wo-status-pill${woStatus===s?' active-'+s:''}" id="wopill_${s}" onclick="setWOStatus('${s}')">${statusMap[s]||s.toUpperCase()}</button>`).join('')}</div></div></div>
                    <div class="field-row two-col"><div class="field"><label>Start Date</label><input type="date" value="${woData.startDate}" oninput="updateWOField('startDate',this.value)"></div><div class="field"><label>Completion Date</label><input type="date" value="${woData.completionDate}" oninput="updateWOField('completionDate',this.value)"></div></div>
                </div></div>
                <div class="section-card"><div class="section-header"><span class="section-dot" style="background:#f97316;"></span><span class="section-title">Customer & Vehicle</span></div><div class="form-body">
                    <div class="field-row two-col"><div class="field"><label>Customer Name</label><input value="${formData.custName}" oninput="updateField('custName',this.value)"></div><div class="field"><label>Phone</label><input value="${formData.custPhone}" oninput="updateField('custPhone',this.value)"></div></div>
                    <div class="field-row three-col"><div class="field"><label>Make</label><input value="${formData.make}" oninput="updateField('make',this.value)"></div><div class="field"><label>Model</label><input value="${formData.model}" oninput="updateField('model',this.value)"></div><div class="field"><label>Year</label><input value="${formData.year}" oninput="updateField('year',this.value)"></div></div>
                    <div class="field-row two-col"><div class="field"><label>Reg</label><input value="${formData.vehicleReg}" oninput="updateField('vehicleReg',this.value)"></div><div class="field"><label>Mileage</label><input value="${formData.mileage}" oninput="updateField('mileage',this.value)"></div></div>
                </div></div>
                <div class="section-card"><div class="section-header"><span class="section-dot" style="background:#f97316;"></span><span class="section-title">Job Details</span></div><div class="form-body">
                    <div class="field"><label>Job Description</label><textarea rows="3" oninput="updateWOField('jobDescription',this.value)">${woData.jobDescription}</textarea></div>
                    <div class="field"><label>Special Instructions</label><textarea rows="2" oninput="updateWOField('specialInstructions',this.value)">${woData.specialInstructions}</textarea></div>
                    <div class="field-row two-col tech-field"><div class="field"><label>Technician</label><input value="${woData.technician}" oninput="updateWOField('technician',this.value)"></div><div class="field"><label>Est. Hours</label><input type="number" step="0.5" value="${woData.estimatedHours}" oninput="updateWOField('estimatedHours',this.value)"></div></div>
                </div></div>
                <div class="section-card"><div class="section-header"><span class="section-dot" style="background:#f97316;"></span><span class="section-title">Parts & Labor</span></div>
                    <div class="items-table-wrap"><table class="items-table"><thead><tr><th>Code</th><th>Description</th><th class="center">Qty</th><th class="right">Unit Price</th><th class="center">KRA</th><th class="right">Total</th><th></th></tr></thead><tbody>
                        ${lineItems.map(item=>`<tr><td><input class="code" value="${item.code||''}" oninput="updateItem(${item.id},'code',this.value)"></td><td><input class="desc" value="${item.description}" oninput="updateItem(${item.id},'description',this.value)"></td><td class="center"><input class="num" type="number" min="1" value="${item.qty}" oninput="updateItem(${item.id},'qty',this.value)"></td><td class="right"><input class="price" type="number" min="0" step="50" value="${item.price}" oninput="updateItem(${item.id},'price',this.value)"></td><td class="center"><input class="kra-code" value="${item.kraCode||''}" oninput="updateItem(${item.id},'kraCode',this.value)"></td><td class="right"><span class="row-total" id="rowTotal_${item.id}">${fmt(item.qty*item.price)}</span></td><td><button class="del-btn" onclick="removeItem(${item.id})">×</button></td></tr>`).join('')}
                    </tbody></table></div>
                    <div style="padding:4px 14px 14px"><button class="add-row-btn" onclick="addItem()">➕ Add Part / Labor</button>
                    <div class="divider"></div>
                    <div class="adj-row"><label>Discount</label><input type="number" min="0" max="100" value="${discountPct}" oninput="updateDiscount(this.value)"><span class="adj-label">%</span></div>
                    <div class="adj-row"><label>VAT</label><input type="number" min="0" max="100" value="${taxPct}" oninput="updateTax(this.value)"><span class="adj-label">%</span></div>
                    <div class="totals-block"><div class="totals-row"><span>Subtotal</span><span id="valSubtotal">${fmt(sub)}</span></div><div class="totals-row"><span>Discount</span><span id="valDiscount">${discountPct>0?'-'+fmt(disc):'—'}</span></div><div class="totals-row"><span>VAT</span><span id="valTax">${fmt(tax)}</span></div></div>
                    <div class="grand-total-row"><span class="label">GRAND TOTAL</span><span class="val" id="valGrand">${fmt(grand)}</span></div>
                </div></div>
                <div class="section-card"><div class="form-body actions">
                    <button class="btn-whatsapp" onclick="generateAndSharePDF()"><span class="btn-icon">📤</span> SHARE TO WHATSAPP</button>
                    <button class="btn-download" onclick="downloadPDF()"><span class="btn-icon">⬇</span> DOWNLOAD PDF</button>
                </div></div>`;
            return;
        }

        // ─── ORIGINAL RENDER (Quotation, Invoice, Receipt) ──
        document.getElementById('mainContent').innerHTML = `
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">${currentTab} Details</span></div><div class="form-body">
                <div class="field-row two-col"><div class="field"><label>${currentTab} Number</label><input value="${formData.invoiceNo}" oninput="updateField('invoiceNo',this.value)"></div><div class="field"><label>Date</label><input type="date" value="${formData.date}" oninput="updateField('date',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>Due Date</label><input value="${formData.dueDate}" oninput="updateField('dueDate',this.value)"></div><div class="field"><label>Status</label><div class="status-pills">${['paid','partial','unpaid'].map(s=>`<button class="status-pill${paymentStatus===s?' active-'+s:''}" id="pill_${s}" onclick="setPayment('${s}')">${s.toUpperCase()}</button>`).join('')}</div></div></div>
                ${currentTab==='RECEIPT'?`<div class="field-row two-col"><div class="field"><label>Method</label><select onchange="window._pm=this.value"><option>MPESA</option><option>Bank</option><option>Cash</option></select></div><div class="field"><label>Ref</label><input value="${paymentRef}" oninput="window._pr=this.value"></div></div>`:''}
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Vehicle</span></div><div class="form-body">
                <div class="field-row two-col"><div class="field"><label>Reg</label><input value="${formData.vehicleReg}" oninput="updateField('vehicleReg',this.value)"></div><div class="field"><label>Year</label><input value="${formData.year}" oninput="updateField('year',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>Make</label><input value="${formData.make}" oninput="updateField('make',this.value)"></div><div class="field"><label>Model</label><input value="${formData.model}" oninput="updateField('model',this.value)"></div></div>
                <div class="field"><label>Mileage</label><input value="${formData.mileage}" oninput="updateField('mileage',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Customer</span></div><div class="form-body">
                <div class="field"><label>Name</label><input value="${formData.custName}" oninput="updateField('custName',this.value)"></div>
                <div class="field-row two-col"><div class="field"><label>Phone</label><input value="${formData.custPhone}" oninput="updateField('custPhone',this.value)"></div><div class="field"><label>Email</label><input value="${formData.custEmail}" oninput="updateField('custEmail',this.value)"></div></div>
                <div class="field"><label>Address</label><input value="${formData.custAddress}" oninput="updateField('custAddress',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Line Items</span></div>
                <div class="items-table-wrap"><table class="items-table"><thead><tr><th>Code</th><th>Description</th><th class="center">Qty</th><th class="right">Unit Price</th><th class="center">KRA</th><th class="right">Total</th><th></th></tr></thead><tbody>
                    ${lineItems.map(item=>`<tr><td><input class="code" value="${item.code||''}" oninput="updateItem(${item.id},'code',this.value)"></td><td><input class="desc" value="${item.description}" oninput="updateItem(${item.id},'description',this.value)"></td><td class="center"><input class="num" type="number" min="1" value="${item.qty}" oninput="updateItem(${item.id},'qty',this.value)"></td><td class="right"><input class="price" type="number" min="0" step="50" value="${item.price}" oninput="updateItem(${item.id},'price',this.value)"></td><td class="center"><input class="kra-code" value="${item.kraCode||''}" oninput="updateItem(${item.id},'kraCode',this.value)"></td><td class="right"><span class="row-total" id="rowTotal_${item.id}">${fmt(item.qty*item.price)}</span></td><td><button class="del-btn" onclick="removeItem(${item.id})">×</button></td></tr>`).join('')}
                </tbody></table></div>
                <div style="padding:4px 14px 14px"><button class="add-row-btn" onclick="addItem()">➕ Add Line Item</button>
                <div class="divider"></div>
                <div class="adj-row"><label>Discount</label><input type="number" min="0" max="100" value="${discountPct}" oninput="updateDiscount(this.value)"><span class="adj-label">%</span></div>
                <div class="adj-row"><label>VAT</label><input type="number" min="0" max="100" value="${taxPct}" oninput="updateTax(this.value)"><span class="adj-label">%</span></div>
                <div class="totals-block"><div class="totals-row"><span>Subtotal</span><span id="valSubtotal">${fmt(sub)}</span></div><div class="totals-row"><span>Discount</span><span id="valDiscount">${discountPct>0?'-'+fmt(disc):'—'}</span></div><div class="totals-row"><span>VAT</span><span id="valTax">${fmt(tax)}</span></div></div>
                <div class="grand-total-row"><span class="label">GRAND TOTAL</span><span class="val" id="valGrand">${fmt(grand)}</span></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Payment Details</span></div><div class="form-body">
                <div class="field-row two-col"><div class="field"><label>Bank</label><input value="${formData.bankName}" oninput="updateField('bankName',this.value)"></div><div class="field"><label>Account</label><input value="${formData.bankAccount}" oninput="updateField('bankAccount',this.value)"></div></div>
                <div class="field"><label>M-Pesa Paybill</label><input value="${formData.mpesaPaybill}" oninput="updateField('mpesaPaybill',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">KRA Compliance</span></div><div class="form-body">
                <div class="kra-badge">🔒 KRA Registered</div>
                <div class="field-row two-col"><div class="field"><label>PIN</label><input value="${formData.kraPin}" oninput="updateField('kraPin',this.value)"></div><div class="field"><label>VAT</label><input value="${formData.vatNo}" oninput="updateField('vatNo',this.value)"></div></div>
                <div class="field-row two-col"><div class="field"><label>ETR Serial</label><input value="${formData.etrSerial}" oninput="updateField('etrSerial',this.value)"></div><div class="field"><label>Fiscalised ID</label><input value="${formData.fiscalisedId}" oninput="updateField('fiscalisedId',this.value)"></div></div>
                <div class="field"><label>Control Code</label><input value="${formData.controlCode}" oninput="updateField('controlCode',this.value)"></div>
            </div></div>
            <div class="section-card"><div class="section-header"><span class="section-dot"></span><span class="section-title">Notes & Terms</span></div><div class="form-body">
                <div class="field"><label>Notes</label><textarea rows="2" oninput="updateField('notes',this.value)">${formData.notes}</textarea></div>
                <div class="field"><label>Terms</label><textarea rows="2" oninput="updateField('terms',this.value)">${formData.terms}</textarea></div>
            </div></div>
            <div class="section-card"><div class="form-body actions">
                <button class="btn-whatsapp" onclick="generateAndSharePDF()"><span class="btn-icon">📤</span> SHARE TO WHATSAPP</button>
                <button class="btn-download" onclick="downloadPDF()"><span class="btn-icon">⬇</span> DOWNLOAD PDF</button>
            </div></div>`;
    }

    // ─── WATCH FOR DYNAMIC CHANGES ──────────────────
    setInterval(() => {
        if (window._pm) paymentMethod = window._pm;
        if (window._pr) paymentRef = window._pr;
    }, 500);

    // ─── GLOBAL EXPOSURE ────────────────────────────
    window.handleFloatingShare = handleFloatingShare;
    window.switchTab = switchTab;
    window.addItem = addItem;
    window.removeItem = removeItem;
    window.updateItem = updateItem;
    window.updateDiscount = updateDiscount;
    window.updateTax = updateTax;
    window.setPayment = setPayment;
    window.updateField = updateField;
    window.generateAndSharePDF = generateAndSharePDF;
    window.downloadPDF = downloadPDF;
    window.setWOStatus = setWOStatus;
    window.updateWOField = updateWOField;
    window.updateChecklistField = updateChecklistField;
    window.updateChecklistItem = updateChecklistItem;

    // ─── INITIAL RENDER ─────────────────────────────
    render();
</script>
</body>
</html>
